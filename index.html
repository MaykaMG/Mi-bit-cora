

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora Trading Pro</title>
  <style>
    body { background-color: #12161C; color: #EAECEF; font-family: sans-serif; padding: 10px; }
    h2 { color: #F0B90B; font-size: 1rem; text-align: center; margin: 15px 0 10px 0; border-bottom: 1px solid #2B313A; padding-bottom: 5px; }
    .card { background-color: #1E2329; border-radius: 8px; padding: 12px; margin-bottom: 12px; border: 1px solid #2B313A; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    label { font-size: 0.7rem; color: #848E9C; display: block; margin-bottom: 2px; }
    input { width: 100%; padding: 8px; background-color: #2B313A; border: 1px solid #474D57; border-radius: 4px; color: #fff; font-size: 0.9rem; }
    .btn-save { width: 100%; background-color: #F0B90B; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 4px; margin-top: 10px; cursor: pointer; }
    .table-cont { overflow-x: auto; margin-top: 10px; font-size: 0.7rem; }
    table { width: 100%; border-collapse: collapse; }
    th { color: #F0B90B; background-color: #2B313A; padding: 6px; }
    td { padding: 6px; border: 1px solid #2B313A; color: #fff; }
    .green { color: #0ECB81; } .red { color: #F6465D; }
  </style>
</head>
<body>

  <h2>1. Simulación</h2>
  <div class="card">
    <div class="grid-2">
      <div><label>Inversión ($)</label><input type="number" id="sInv" value="50" oninput="calcSim()"></div>
      <div><label>P. Compra</label><input type="number" id="sBuy" value="60000" oninput="calcSim()"></div>
    </div>
    <div class="grid-2">
      <div><label>P. Venta</label><input type="number" id="sSell" value="62000" oninput="calcSim()"></div>
      <div><label>Ganancia Neta</label><input type="text" id="sProfit" readonly style="color:#0ECB81"></div>
    </div>
    <div class="grid-2">
      <div><label>Com. Compra</label><input type="text" id="sFeeBuy" readonly></div>
      <div><label>Com. Venta</label><input type="text" id="sFeeSell" readonly></div>
    </div>
  </div>

  <h2>2. Registro Real</h2>
  <div class="card">
    <div class="grid-2">
      <div><label>Inversión ($)</label><input type="number" id="rInv" oninput="calcReal()"></div>
      <div><label>P. Compra</label><input type="number" id="rBuy" oninput="calcReal()"></div>
    </div>
    <div class="grid-2">
      <div><label>P. Venta</label><input type="number" id="rSell" oninput="calcReal()"></div>
      <div><label>Ganancia Neta</label><input type="text" id="rProfit" readonly style="color:#0ECB81"></div>
    </div>
    <div class="grid-2">
      <div><label>Com. Compra</label><input type="text" id="rFeeBuy" readonly></div>
      <div><label>Com. Venta</label><input type="text" id="rFeeSell" readonly></div>
    </div>
    <button class="btn-save" onclick="save()">Registrar Operación</button>
  </div>

  <h2>4. Bitácora</h2>
  <div class="card">
    <div class="table-cont">
      <table>
        <thead><tr><th>Inv</th><th>P.Compra</th><th>P.Venta</th><th>Com.Buy</th><th>Com.Sell</th><th>Ganancia</th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </div>

<script>
  // Cálculos de Simulación
  function calcSim() {
    let inv = parseFloat(document.getElementById('sInv').value)||0;
    let buy = parseFloat(document.getElementById('sBuy').value)||0;
    let sell = parseFloat(document.getElementById('sSell').value)||0;
    if(inv > 0 && buy > 0) {
      let fBuy = inv * 0.001;
      let crypto = (inv - fBuy) / buy;
      let fSell = (crypto * sell) * 0.001;
      let profit = (crypto * sell) - fSell - inv;
      document.getElementById('sFeeBuy').value = fBuy.toFixed(4);
      document.getElementById('sFeeSell').value = fSell.toFixed(4);
      document.getElementById('sProfit').value = profit.toFixed(2);
    }
  }

  // Cálculos de Registro Real
  function calcReal() {
    let inv = parseFloat(document.getElementById('rInv').value)||0;
    let buy = parseFloat(document.getElementById('rBuy').value)||0;
    let sell = parseFloat(document.getElementById('rSell').value)||0;
    if(inv > 0 && buy > 0 && sell > 0) {
      let fBuy = inv * 0.001;
      let crypto = (inv - fBuy) / buy;
      let fSell = (crypto * sell) * 0.001;
      let profit = (crypto * sell) - fSell - inv;
      document.getElementById('rFeeBuy').value = fBuy.toFixed(4);
      document.getElementById('rFeeSell').value = fSell.toFixed(4);
      document.getElementById('rProfit').value = profit.toFixed(2);
      document.getElementById('rProfit').className = profit >= 0 ? 'green' : 'red';
    }
  }

  function save() {
    let data = JSON.parse(localStorage.getItem('db')||'[]');
    data.unshift({
      inv: document.getElementById('rInv').value,
      buy: document.getElementById('rBuy').value,
      sell: document.getElementById('rSell').value,
      fb: document.getElementById('rFeeBuy').value,
      fs: document.getElementById('rFeeSell').value,
      pro: document.getElementById('rProfit').value
    });
    localStorage.setItem('db', JSON.stringify(data));
    render();
  }

  function render() {
    let data = JSON.parse(localStorage.getItem('db')||'[]');
    let html = data.map(i => `<tr><td>$${i.inv}</td><td>$${i.buy}</td><td>$${i.sell}</td><td>$${i.fb}</td><td>$${i.fs}</td><td class="${i.pro>=0?'green':'red'}">$${i.pro}</td></tr>`).join('');
    document.getElementById('history').innerHTML = html;
  }
  
  calcSim(); render();
</script>
</body>
</html>
